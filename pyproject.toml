[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecological_sign_rules"
version = "0.5.3"
description = "Prove Lotka-Volterra sign patterns impossible, with machine certificates and an independent checker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Georgy Scholten", email = "scholtengeorgy@gmail.com"}]
maintainers = [{name = "Georgy Scholten", email = "scholtengeorgy@gmail.com"}]
requires-python = ">=3.10"
keywords = ["Lotka-Volterra", "sign pattern", "qualitative stability", "mathematical ecology", "oriented matroid",
            "chirotope", "Grassmannian", "computer-assisted proof", "certificate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",     # certificate and completion drawings (gvrender, treeplot); the palette of style.py
    "networkx>=3.0",       # tree layout in treeplot
    "rich>=13.0",          # the dashboard and the verdict of the signrules command
    "textual>=1.0",        # the app: plain `signrules`, `signrules edit`
]

[project.optional-dependencies]
live = ["questionary>=2.0"]                  # arrow-key menus of `signrules run` without a pattern
html = ["plotly>=5.0"]                        # the plotly figure of a search tree (save_search_tree_html)
all = ["ecological_sign_rules[live,html]"]

# `uv sync` installs the package and this group; `uv sync --all-extras` adds the extras
[dependency-groups]
dev = ["pytest>=7.0", "pytest-timeout>=2.0"]

[project.scripts]
signrules = "signrules.cli:main"

[project.urls]
Repository = "https://github.com/gescholt/signrules"
Documentation = "https://github.com/gescholt/signrules/blob/main/docs/SIGNRULES.md"
Issues = "https://github.com/gescholt/signrules/issues"
Changelog = "https://github.com/gescholt/signrules/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.24214426"

[tool.setuptools.packages.find]
include = ["signrules*"]

[tool.setuptools.package-data]
signrules = ["data/n4/*.jsonl", "data/n5/*.jsonl", "data/n6/*.jsonl"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--timeout=120"]
filterwarnings = ["error", "ignore::UserWarning", "ignore::DeprecationWarning"]
