name: release
# a published GitHub release goes to PyPI (trusted publishing, no token) and, through the Zenodo
# GitHub integration, to Zenodo
on:
  release:
    types: [published]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ecological_sign_rules/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: The tag is the version in pyproject.toml
        run: test "v$(uv version --short)" = "${{ github.event.release.tag_name }}"
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv publish --trusted-publishing always
