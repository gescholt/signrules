name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # the suite with every extra, on the oldest and the newest supported Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get install -y --no-install-recommends graphviz
      - run: pip install -e ".[all,dev]"
      - run: pytest -q

  wheel:
    # what a user gets: the built wheel, without extras and without Graphviz, passes the same suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine pytest pytest-timeout
      - run: python -m build
      - run: twine check dist/*
      - run: pip install dist/*.whl
      - name: The tests import the installed wheel, not the checkout
        run: |
          rm -rf signrules
          pytest -q
