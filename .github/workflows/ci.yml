name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # the suite with every extra, on the oldest and the newest supported Python, from the lock file
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: sudo apt-get install -y --no-install-recommends graphviz
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  wheel:
    # what a user gets: the built wheel, without extras and without Graphviz, passes the same suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv venv /tmp/wheel-env && uv pip install --python /tmp/wheel-env dist/*.whl pytest pytest-timeout
      - name: The tests import the installed wheel, not the checkout
        run: |
          rm -rf signrules
          /tmp/wheel-env/bin/pytest -q

  install:
    # the README's one-line install, from this commit on GitHub: no checkout, no lock file
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - name: uvx --from git+…@sha signrules
        run: |
          SRC="git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}"
          uvx --from "$SRC" signrules --version
          uvx --from "$SRC" signrules run --preset A-e --plain | tee out.txt
          grep -qi "impossible" out.txt
